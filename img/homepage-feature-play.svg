<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Play and retrieve feature graphic</title>
  <desc id="desc">A revision arcade style game board with bright tiles, check marks, and score elements.</desc>
  <defs>
